target-version = "py310"
line-length = 120
exclude = [
    "backend/venv",
    ".venv",
    "node_modules",
    "dist"
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (formatter handles)
    "B008", # FastAPI Depends/Query/File/Form in default args
    "B904", # raise HTTPException without from err
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["E402"]
