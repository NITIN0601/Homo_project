<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="#2d6a4f" stroke-width="2.5" />

  <!-- Soft Glow Shield Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#40916c" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Symmetrical Medical Cross -->
  <g fill="url(#crossGrad)">
    <!-- Vertical Bar -->
    <rect x="42" y="24" width="16" height="52" rx="8" />
    <!-- Horizontal Bar -->
    <rect x="24" y="42" width="52" height="16" rx="8" />
  </g>

  <!-- Vital Heartbeat / Care Accent Line -->
  <path d="M30 50 L42 50 L46 39 L54 61 L58 50 L70 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Core Dot -->
  <circle cx="50" cy="50" r="2.5" fill="#d8f3dc" />
</svg>

